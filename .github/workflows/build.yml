name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup templates, keystore and editor settings
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          rm -f /root/debug.keystore
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore /root/debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          JAVA_DIR=$(dirname "$(dirname "$(readlink -f "$(which java)")")")
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "${JAVA_DIR}"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOS
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Import project
        run: godot --headless --import || true

      - name: Export debug APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android" build/VolleyRivals.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VolleyRivals-apk
          path: build/VolleyRivals.apk
